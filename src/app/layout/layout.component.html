<div class="flex h-screen bg-gray-100 relative">
  <!-- Toasts -->
  <div class="fixed top-4 right-4 z-50 flex flex-col gap-2">
    @for (toast of toastService.toasts() || []; track toast.id) {
      <div
        class="px-4 py-3 rounded-lg shadow-lg border-l-4 min-w-[300px] flex justify-between items-center"
        [ngClass]="{
          'bg-green-50 border-green-500 text-green-800': toast.type === 'success',
          'bg-red-50 border-red-500 text-red-800': toast.type === 'error',
          'bg-blue-50 border-blue-500 text-blue-800': toast.type === 'info',
          'bg-yellow-50 border-yellow-500 text-yellow-800': toast.type === 'warning',
        }"
      >
        <span class="text-sm font-medium">{{ toast.message }}</span>
        <button
          (click)="toastService.remove(toast.id)"
          class="ml-4 text-gray-400 hover:text-gray-600 transition-colors"
          aria-label="Dismiss notification"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    }
  </div>

  <!-- Sidebar -->
  <aside class="w-64 bg-slate-800 text-white flex flex-col shadow-lg">
    <!-- Logo -->
    <div class="p-6 text-2xl font-bold border-b border-slate-700 flex items-center gap-2">
      <!-- <div
        class="w-8 h-8 bg-gradient-to-br from-blue-400 to-blue-600 rounded-lg flex items-center justify-center"
      >
        <span class="text-white font-bold">ℱ</span>
      </div> -->
      <span class="text-blue-400">FinXP</span>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-blue-600 text-white"
        [routerLinkActiveOptions]="{ exact: true }"
        class="block px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white transition-colors font-medium"
      >
        <span class="flex items-center gap-3">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 12l2-3m0 0l7-4 7 4M5 9v10a1 1 0 001 1h12a1 1 0 001-1V9m-9 4l4 2m-5-5l4-2"
            />
          </svg>
          Dashboard
        </span>
      </a>
      <a
        routerLink="/entities"
        routerLinkActive="bg-blue-600 text-white"
        class="block px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white transition-colors font-medium"
      >
        <span class="flex items-center gap-3">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"
            />
          </svg>
          Employees
        </span>
      </a>
      <a
        routerLink="/workflows"
        routerLinkActive="bg-blue-600 text-white"
        class="block px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white transition-colors font-medium"
      >
        <span class="flex items-center gap-3">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 10V3L4 14h7v7l9-11h-7z"
            />
          </svg>
          Workflows
        </span>
      </a>
      <a
        routerLink="/audit"
        routerLinkActive="bg-blue-600 text-white"
        class="block px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white transition-colors font-medium"
      >
        <span class="flex items-center gap-3">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
            />
          </svg>
          Audit Trail
        </span>
      </a>
    </nav>

    <!-- User & Logout -->
    <div class="p-4 border-t border-slate-700 space-y-3">
      <div class="px-4 py-3 rounded-lg bg-slate-700">
        <p class="text-xs text-slate-400 uppercase tracking-wider">Signed in as</p>
        <p class="font-medium text-white mt-1">{{ currentUser }}</p>
      </div>
      <button
        (click)="onLogout()"
        routerLink="/login"
        class="w-full px-4 py-3 rounded-lg text-slate-300 hover:bg-red-900/30 hover:text-red-300 transition-colors font-medium flex items-center gap-3"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
          />
        </svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Header -->
    <header
      class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm"
    >
      <h1 class="text-xl font-semibold text-gray-800">FinXP Framework Management</h1>
      <div class="flex items-center space-x-4">
        <div class="text-right">
          <p class="text-sm text-gray-500">Welcome</p>
          <p class="font-medium text-gray-800">{{ currentUser }}</p>
        </div>
        <div
          class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center text-white font-bold shadow-md"
        >
          {{ userInitial }}
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
