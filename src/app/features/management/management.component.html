<div class="p-6">
  <div class="mb-6">
    <h1 class="text-3xl font-bold text-gray-800 mb-2">User Management</h1>
    <p class="text-gray-600">Manage users, roles, and permissions in the system</p>
  </div>

  <!-- Tabs -->
  <div class="flex gap-2 border-b border-gray-200 mb-6">
    <button
      (click)="activeTab = 'users'"
      [class]="'px-4 py-2 font-medium transition-colors ' + (activeTab === 'users' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600 hover:text-gray-800')"
    >
      Users
    </button>
    <button
      (click)="activeTab = 'roles'"
      [class]="'px-4 py-2 font-medium transition-colors ' + (activeTab === 'roles' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600 hover:text-gray-800')"
    >
      Roles
    </button>
    <button
      (click)="activeTab = 'permissions'"
      [class]="'px-4 py-2 font-medium transition-colors ' + (activeTab === 'permissions' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600 hover:text-gray-800')"
    >
      Permissions
    </button>
  </div>

  <!-- Users Tab -->
  @if (activeTab === 'users') {
    <app-user-list></app-user-list>
  }

  <!-- Roles Tab -->
  @if (activeTab === 'roles') {
    <app-role-list></app-role-list>
  }

  <!-- Permissions Tab -->
  @if (activeTab === 'permissions') {
    <app-permission-list></app-permission-list>
  }
</div>
