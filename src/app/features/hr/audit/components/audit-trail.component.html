<div class="space-y-6 p-6">
  <!-- Error Alert -->
  <div *ngIf="error" class="p-4 bg-red-50 border border-red-200 rounded-lg" role="alert">
    <p class="text-sm font-semibold text-red-800">{{ error }}</p>
  </div>

  <!-- Header -->
  <div custom-card>
    <h3 card-title>Audit Trail</h3>
    <div card-action>
      <app-button label="Export to PDF" variant="secondary" size="normal" (clicked)="exportPDF()" />
    </div>
  </div>

  <!-- Loading State -->
  <app-spinner *ngIf="isLoading"></app-spinner>

  <!-- Filters -->
  <div custom-card *ngIf="!isLoading">
    <h3 card-title>Filters</h3>
    <div class="p-4 grid grid-cols-1 md:grid-cols-4 gap-4" [formGroup]="filterForm">
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Date From</label>
        <input type="date" formControlName="dateFrom"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Date To</label>
        <input type="date" formControlName="dateTo"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">User</label>
        <select formControlName="user"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          <option>All Users</option>
          <option>Admin</option>
          <option>System</option>
          <option>User</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Action</label>
        <select formControlName="action"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          <option>All Actions</option>
          <option>CREATE</option>
          <option>UPDATE</option>
          <option>ACTIVATE</option>
          <option>DEACTIVATE</option>
          <option>DELETE</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Audit Table -->
  <div custom-card *ngIf="!isLoading && filteredLogs.length > 0">
    <h3 card-title>Audit Logs</h3>
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Timestamp</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">User</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Action</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Details</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">IP Address</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <tr *ngFor="let log of filteredLogs" class="hover:bg-gray-50 transition-colors">
            <td class="px-6 py-4 text-sm text-gray-500">{{ log.timestamp }}</td>
            <td class="px-6 py-4 text-sm font-medium text-gray-900">{{ log.user }}</td>
            <td class="px-6 py-4">
              <span class="px-3 py-1 text-xs font-semibold rounded-full uppercase"
                [ngClass]="getActionBadgeClass(log.action)">
                {{ log.action }}
              </span>
            </td>
            <td class="px-6 py-4 text-sm text-gray-600">{{ log.details }}</td>
            <td class="px-6 py-4 text-sm text-gray-500 font-mono">{{ log.ipAddress }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Empty State -->
  <div custom-card *ngIf="!isLoading && filteredLogs.length === 0">
    <div class="p-12 text-center">
      <p class="text-gray-500 font-medium text-lg">No audit logs found</p>
      <p class="text-gray-400 text-sm mt-1">Try adjusting your filters</p>
    </div>
  </div>
</div>
